<title>Khảo sát KDI MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: thanh menu ngang của hệ thống chung (giống phân hệ Nhân sự) → tiêu đề trang + nút thao tác bên phải → nội dung một cột rộng, bảng xanh tiêu đề trắng. */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --surface-2:#f7f9fc; --line:#dbe3ee; --fg:#1b2a41; --muted:#5d6c82;
  --brand:#154b98; --brand-2:#2f73c3; --thead:#0f6fae; --brand-soft:#e7effa; --accent:#f2a12a; --accent-soft:#fff3df;
  --ok:#1d9560; --ok-soft:#e3f5ec; --warn:#b97c00; --warn-soft:#fff4d6; --bad:#cc4035; --bad-soft:#fde9e7;
  --c1:#2f73c3; --c2:#f2a12a; --c3:#1d9f8f; --c4:#8a6fd1; --c5:#d0617a;
  --font:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --shadow:0 6px 24px rgba(21,75,152,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1520; --surface:#16202d; --surface-2:#1b2737; --line:#2a3849; --fg:#e5ecf5; --muted:#97a6ba;
  --brand:#7fb0f0; --brand-2:#3d82cf; --thead:#1d5f93; --brand-soft:#1b2c44; --accent:#f5b14e; --accent-soft:#3a2d17;
  --ok:#4cc48c; --ok-soft:#173528; --warn:#e2b04a; --warn-soft:#382d12; --bad:#f07a6f; --bad-soft:#3d1d1a;
  --c1:#5b9be4; --c2:#f5b14e; --c3:#3fc2b0; --c4:#a790e6; --c5:#e47f96; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520; --surface:#16202d; --surface-2:#1b2737; --line:#2a3849; --fg:#e5ecf5; --muted:#97a6ba;
  --brand:#7fb0f0; --brand-2:#3d82cf; --thead:#1d5f93; --brand-soft:#1b2c44; --accent:#f5b14e; --accent-soft:#3a2d17;
  --ok:#4cc48c; --ok-soft:#173528; --warn:#e2b04a; --warn-soft:#382d12; --bad:#f07a6f; --bad-soft:#3d1d1a;
  --c1:#5b9be4; --c2:#f5b14e; --c3:#3fc2b0; --c4:#a790e6; --c5:#e47f96; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* review banner */
.review{background:var(--accent-soft);color:var(--fg);border-bottom:1px solid var(--line);font-size:13px;padding-block:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.review b{color:var(--warn)}

/* system menu */
.sysbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.sysrow{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:thin}
.mi{position:relative;display:flex;align-items:center;gap:6px;padding:10px 12px;white-space:nowrap;color:var(--muted);border:0;background:none;border-bottom:3px solid transparent}
.mi svg{width:17px;height:17px;flex:none}
.brandmark{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--brand);white-space:nowrap;padding:8px 18px 8px 0;margin-right:6px;border-right:1px solid var(--line)}
.brandmark b{background:var(--brand);color:#fff;border-radius:4px;padding:2px 7px;font-size:12.5px;letter-spacing:.04em}
.mi{font-weight:500}
.mi.sys{opacity:.85}
.mi.sys:hover{color:var(--fg)}
.mi.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand);background:var(--brand-soft)}
.mi .car{width:10px;height:10px;opacity:.7}
.dd{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px;min-width:260px;padding:4px 0}
.dd button{display:flex;width:100%;text-align:left;border:0;background:none;padding:10px 16px;gap:10px;align-items:center}
.dd button:hover{background:var(--brand-soft)}
.dd button.on{background:var(--brand-2);color:#fff}
.dd small{display:block;color:var(--muted);font-size:12px}
.dd button.on small{color:#dbe9fb}

/* page head */
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.ptitle{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--brand);font-size:16px;margin:0}
.ptitle .tile{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.ptitle .tile i{display:block;border-radius:1px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid transparent;border-radius:4px;padding:8px 16px;font-weight:600;background:var(--brand-2);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--brand);border-color:var(--line)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.warm{background:var(--accent);color:#2b1d00}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:16px;height:16px}

main{padding-bottom:40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
h2{font-size:15px;margin:0 0 10px;text-wrap:balance}
h3{font-size:14px;margin:0 0 8px}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* filter bar */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 0}
.field{display:flex;align-items:center;gap:8px}
.field b{font-weight:600}
.select,.input{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 10px;min-width:0}
.input{width:100%}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:var(--thead);color:#fff;font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.18)}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--surface-2)}
td.c,th.c{text-align:center}
td .link{display:inline-block;min-width:220px}
.link{color:var(--brand-2);font-weight:600;background:none;border:0;padding:0;text-align:left}
.link:hover{text-decoration:underline}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.open{background:var(--ok-soft);color:var(--ok)}
.chip.draft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.closed{background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain::before{display:none}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--c1)}

/* survey context strip */
.ctx{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;margin-bottom:14px}
.ctx .name{font-weight:700;font-size:15px}
.steps{display:flex;gap:0;flex-wrap:wrap;margin-left:auto}
.step{border:1px solid var(--line);background:var(--surface);padding:6px 14px;font-size:13px;display:flex;gap:6px;align-items:center;margin-left:-1px}
.step:first-child{border-radius:4px 0 0 4px;margin-left:0}.step:last-child{border-radius:0 4px 4px 0}
.step .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.step.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
.step.on .n{background:#fff;color:var(--brand-2);border-color:#fff}
.step.done .n{background:var(--ok);color:#fff;border-color:var(--ok)}

/* create choices */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.choice:hover{border-color:var(--brand-2)}
.choice.on{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2);background:var(--brand-soft)}
.choice .ic{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.choice.on .ic{background:var(--surface)}
.choice .ic svg{width:22px;height:22px}
.choice strong{font-size:15px}
.tag{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:3px;padding:1px 6px;align-self:flex-start}

.wiz{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.wiz span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.wiz span b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:12px}
.wiz span.on{color:var(--fg);font-weight:600}.wiz span.on b{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
.wiz span.done b{background:var(--ok);color:#fff;border-color:var(--ok)}
.wiz i{flex:none;width:28px;height:1px;background:var(--line);align-self:center}

.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.drop{border:2px dashed var(--line);border-radius:6px;padding:22px;display:flex;gap:14px;align-items:center;background:var(--surface-2)}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.fico{width:34px;height:40px;border-radius:3px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;flex:none}
.fico.w{background:#2b5fb4}.fico.x{background:#1f7a45}
.rules{font-size:13px}
.rules code{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.rules ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.sample{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;white-space:pre-wrap;margin:8px 0 0;overflow-x:auto}

.qsec td{background:var(--brand-soft);font-weight:700;color:var(--brand)}
tr.bad td{background:var(--warn-soft)}
.opts{color:var(--muted);font-size:13px}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start}
.qlist{padding:8px}
.qlist .sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 8px 4px}
.qi{display:flex;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:4px;align-items:flex-start}
.qi:hover{background:var(--surface-2)}
.qi.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.qi .no{flex:none;width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.qedit{display:grid;gap:14px}
.flabel{display:grid;gap:6px;font-weight:600;font-size:13px}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.typegrid button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px;text-align:left;font-size:13px}
.typegrid button.on{border-color:var(--brand-2);background:var(--brand-soft);color:var(--brand);font-weight:600}
.optrow{display:flex;gap:8px;align-items:center}
.optrow .dot{width:14px;height:14px;border:2px solid var(--line);border-radius:50%;flex:none}
.optrow .dot.sq{border-radius:3px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--brand-2)}.switch input:checked::after{left:18px}
.tpick{position:relative;min-width:0}
.tbtn{display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden}
.tbtn span:not(.chev){overflow:hidden;text-overflow:ellipsis}
.tbtn .chev{margin-left:auto;color:var(--muted)}
.ti{width:18px;height:18px;flex:none;color:var(--muted)}
.tmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:40;width:260px;max-height:380px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(15,30,60,.16);padding:4px 6px 6px}
.tmenu .tg{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.tmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:7px 8px;border:0;background:none;border-radius:4px;font:inherit;color:var(--fg);cursor:pointer;text-align:left}
.tmenu button:hover,.tmenu button:focus-visible{background:var(--surface-2)}
.tmenu button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tmenu button.on .ti{color:var(--brand)}
details.adv{border:1px solid var(--line);border-radius:4px;padding:8px 12px;background:var(--surface-2)}
details.adv summary{cursor:pointer;font-weight:600;font-size:13px}

/* publish */
.qr{width:150px;height:150px;image-rendering:pixelated;background:#fff;padding:8px;border:1px solid var(--line);border-radius:4px}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy .input{flex:1 1 240px;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.rtabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:4px 0 14px}
.rtab{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
.rtab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.insight{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.insight li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.insight li b.k{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brand-2);color:#fff;font-size:12px}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.hb .tr{height:16px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:3px}
.hb .vv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--surface)}
.legend{display:grid;gap:6px;font-size:13px}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:11px;height:11px;border-radius:2px;flex:none}
.cols{display:flex;align-items:flex-end;gap:14px;height:150px;padding:0 6px;border-bottom:1px solid var(--line)}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.cols div i{display:block;width:100%;max-width:46px;background:var(--c1);border-radius:3px 3px 0 0}
.colx{display:flex;gap:14px;padding:4px 6px 0;font-size:12px;color:var(--muted)}
.colx span{flex:1;text-align:center}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.quote{border-left:3px solid var(--line);padding:4px 10px;color:var(--muted);font-size:13px;margin:6px 0}
.qgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));align-items:stretch}
.qgrid .qcard{grid-template-rows:auto 1fr;align-items:center}
.qcard{padding:16px;display:grid;gap:12px;min-width:0}
.qcard .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.export{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:4px;font-weight:600;box-shadow:var(--shadow);z-index:60}
.note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:8px 12px;background:var(--surface)}
.note b{color:var(--warn)}

/* v4: menu thả xuống, khu soạn khảo sát, quản trị */
.mi .car{margin-left:2px}
.dd button .k{font-variant-numeric:tabular-nums;color:var(--muted);min-width:30px}
.dd button.on .k{color:#dbe9fb}
.subtabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);margin:0 0 14px}
.subtabs button{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
.subtabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.pending{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:4px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13px;margin-bottom:12px}
.pending .btn{margin-left:auto}
.feed{display:grid;gap:0;margin:0;padding:0;list-style:none}
.feed li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums}
.attn{display:grid;gap:8px}
.attn div{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.phone{width:min(100%,340px);border:10px solid var(--fg);border-radius:26px;background:var(--bg);padding:16px;display:grid;gap:12px;margin-inline:auto}
.phone.desk{width:100%;border-width:1px;border-color:var(--line);border-radius:6px}
.pq{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px}
.pq label{display:flex;gap:8px;align-items:center}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tcard{display:grid;gap:8px;padding:16px}
.tcard .swatch{height:6px;border-radius:3px}
.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.kv{display:grid;grid-template-columns:minmax(120px,40%) minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
details.card{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
details.card>summary{cursor:pointer;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";color:var(--muted)}
details.card[open]>summary::after{content:"－"}
details.card>div{padding:0 16px 16px;display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

function renderMenu(){
  const g=GROUP(state.view);
  $('#sysmenu').innerHTML = `<span class="brandmark"><b>KDI</b>Hệ thống khảo sát STEM</span>` + MENU.map((m,i)=>
    m.sub ? `<button class="mi ${g===i?'on':''}" data-menu="${i}" aria-haspopup="true" aria-expanded="${state.open===i}">${ic[m.i]}<span>${m.l}</span>${ic.car}</button>`
          : `<button class="mi ${g===i?'on':''}" data-go="${m.k}">${ic[m.i]}<span>${m.l}</span></button>`).join('');

function renderDD(){
  const host=$('#ddhost'); const i=state.open;
  if(i<0){host.innerHTML='';return;}
  const b=$(`[data-menu="${i}"]`); if(!b){host.innerHTML='';return;}
  const r=b.getBoundingClientRect(); const left=Math.max(8,Math.min(r.left, innerWidth-300));
  host.innerHTML=`<div class="dd" style="top:${r.bottom+scrollY}px;left:${left}px;min-width:290px" role="menu">${MENU[i].sub.map(([v,l,s])=>`<button role="menuitem" data-go="${v}" class="${state.view===v?'on':''}"><span>${l}<small>${s}</small></span></button>`).join('')}</div>`;
}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-menu]');
  if(m){state.open = state.open===+m.dataset.menu ? -1 : +m.dataset.menu; renderMenu(); renderDD(); return;}
  if(state.open>=0 && !e.target.closest('.dd')){state.open=-1; renderMenu(); renderDD();}
});
addEventListener('resize',()=>state.open>=0&&renderDD());

function go(v,extra={}){
  if(LEGACY[v]){extra={...LEGACY[v],...extra}; v='survey';}
  if(extra.etab==='st'){extra.wt='cd';}
  if(v==='survey'&&!extra.wt) extra.wt=DEFAULT_TAB[SURVEYS.find(x=>x.id===(extra.survey??state.survey)).status];
  if(v==='survey'&&extra.wt!=='soan') extra.pv=false;
  Object.assign(state,extra,{view:v,open:-1}); if(location.hash!=='#'+v) history.replaceState(null,'','#'+v); render(); scrollTo({top:0});}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]'); if(g){e.preventDefault(); const x={}; if(g.dataset.sid) x.survey=+g.dataset.sid; if(g.dataset.etab) x.etab=g.dataset.etab; if(g.dataset.wt) x.wt=g.dataset.wt; go(g.dataset.go,x);}});
addEventListener('hashchange',()=>{const v=location.hash.slice(1); if(TITLE[v]&&v!==state.view) go(v)});

     <label class="flabel" for="nn">Tên khảo sát<input class="input" id="nn" value="Khảo sát hài lòng phụ huynh học kỳ I"></label>
     <label class="flabel" for="np">Dự án / phòng ban<select class="select" id="np"><option>Đào tạo & sự kiện</option><option>Giáo dục STEM 2026–2027</option><option>+ Thêm dự án mới</option></select></label>

     <div><button class="btn" data-go="edit" data-sid="4">Tạo và soạn câu hỏi</button></div></div>`;

   `<div class="choices">${choice('file',ic.up,'Nhập từ file Word / Excel','Đưa file câu hỏi có sẵn vào, hệ thống tự tách câu hỏi và lựa chọn. Chỉ cần sửa lại chỗ chưa đúng.','<span class="tag">Mới · nhanh nhất</span>')}

      <div class="file"><span class="fico ${ft}">${ft==='w'?'W':'X'}</span><div style="flex:1;min-width:0"><b>${ft==='w'?'Cau-hoi-khao-sat-STEM-2026.docx':'Cau-hoi-khao-sat-STEM-2026.xlsx'}</b><div class="muted">${ft==='w'?'48 KB':'21 KB'} · vừa chọn</div></div><span class="chip open">Sẵn sàng</span></div>

   b) Năng lượng tái tạo
8. Mức độ sẵn sàng của giáo viên (1-5) (*)</div>`
      :`<ul><li>Mỗi dòng là một câu hỏi.</li><li>Cột: <code>Phần</code> · <code>Câu hỏi</code> · <code>Loại</code> · <code>Lựa chọn</code> · <code>Bắt buộc</code></li><li>Các lựa chọn cách nhau bằng dấu <code>;</code></li><li>Cột Bắt buộc ghi <code>x</code> nếu bắt buộc.</li></ul>

      <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-toast="Mockup: nút này sẽ tải file mẫu">${ic.dl}Tải file mẫu ${ft==='w'?'Word':'Excel'}</button></div>

/* ---------- hồ sơ khảo sát: 2 dòng đầu + 5 tab theo vòng đời ---------- */
function vSurvey(){
  const s=S(), w=state.wt, draft=s.status==='draft';
  const done={soan:!draft, phat:s.got>0, phan:s.got>0, bc:s.status==='closed'};
  const stat = draft ? `<span class="muted">${NQ()} câu hỏi · chưa phát hành</span>`
    : `<span class="num"><b>${s.got}/${s.target}</b> <span class="muted">đã trả lời · ${s.start} – ${s.end||'không thời hạn'}</span></span>`;
  const acts = {
    soan: `<button class="btn ghost sm" data-pv="1">${state.pv?'Quay lại soạn':'Xem trước & kiểm tra logic'}</button><button class="btn sm warm" data-toast="Đã xuất bản phiên bản 3">Xuất bản phiên bản 3</button>`,
    phat: `<button class="btn ghost sm" data-toast="Đã tạm dừng nhận trả lời">Tạm dừng</button><button class="btn sm" data-toast="Đã lưu cấu hình phát hành">Lưu cấu hình</button>`,
    phan: `<button class="btn ghost sm" data-go="export">${ic.dl}Xuất dữ liệu</button>`,
    bc: `<button class="btn sm" data-rt="xuat">${ic.dl}Xuất báo cáo</button>`,
    cd: `<button class="btn sm" data-toast="Đã lưu cài đặt">Lưu cài đặt</button>`,
  }[w];
  let body='';
  if(w==='soan') body = state.pv ? editPreview() : editQuestions();
  if(w==='phat') body = vPublish() + vProgress();
  if(w==='phan') body = vResponses();
  if(w==='bc') body = vReport();
  if(w==='cd') body = editSettings();
  return `<div class="ehead"><div class="ttl"><button class="btn ghost sm" data-go="list" aria-label="Về danh sách khảo sát">←</button><span class="nm" title="${esc(s.name)}">${esc(s.name)}</span><span class="chip ${ST[s.status][0]}">${ST[s.status][1]}</span>${stat}</div>
     <div class="actions">${acts}</div></div>
   <div class="subtabs etabs wtabs" role="tablist">${WTABS.map(([k,l],i)=>`<button role="tab" aria-selected="${w===k}" class="${w===k?'on':''}" data-wt="${k}" data-go="survey"><span class="n ${done[k]&&w!==k?'ok':''}">${k==='cd'?'⚙':done[k]&&w!==k?'✓':i+1}</span>${l}</button>`).join('')}
     ${w==='soan'?`<span class="chip warn" style="margin-left:auto;align-self:center" title="2 câu sửa, 1 câu thêm. Người trả lời vẫn thấy phiên bản 2.">3 thay đổi chưa xuất bản</span>`:''}</div>`+body;
}
function typeSel(x,t,n){

      <details class="adv" style="flex:1 1 420px" ${x.check?'open':''}><summary>Tùy chọn nâng cao</summary><div style="display:grid;gap:8px;margin-top:8px" class="muted">
       <span>Chỉ hiện câu này khi: <select class="select" id="cond${id}"><option>Luôn hiện</option><option ${x.cond?'selected':''}>Câu 2 = THCS hoặc THPT</option></select></span>

       <label class="switch" for="pii${id}"><input type="checkbox" id="pii${id}" ${isPersonal(x)?'checked':''}>Chứa dữ liệu cá nhân (che khi xem và khi xuất)</label>

    </section>`;

  const all=QS.map(x=>x.sec!=null?sec(x):x.b?blk(x):card(x)).join('');

}

function hbars(rows,total,color='var(--c1)'){const mx=Math.max(...rows.map(r=>r[1]));return `<div class="hbars">${rows.map(([l,v])=>`<div class="hb"><span>${l}</span><div class="tr"><i style="width:${v/mx*100}%;background:${color}"></i></div><span class="vv">${v} · ${Math.round(v/total*100)}%</span></div>`).join('')}</div>`}
function donut(rows){const tot=rows.reduce((a,r)=>a+r[1],0);let acc=0;const stops=rows.map(r=>{const a=acc/tot*360;acc+=r[1];return `${r[2]} ${a}deg ${acc/tot*360}deg`}).join(',');

/* ---------- QR minh họa ---------- */
function drawQR(){const c=$('#qr'); if(!c) return; const x=c.getContext('2d'); const n=29; let s=7;
  const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#10233f';
  for(let i=0;i<n;i++)for(let j=0;j<n;j++) if(r()>.52) x.fillRect(i,j,1,1);
  const f=(a,b)=>{x.fillStyle='#fff';x.fillRect(a-1,b-1,9,9);x.fillStyle='#10233f';x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#10233f';x.fillRect(a+2,b+2,3,3)};
  f(1,1);f(n-8,1);f(1,n-8);}

function render(){ document.documentElement.classList.toggle('fit', state.view==='survey'&&state.wt==='soan'&&!state.pv); $('#app').innerHTML=(VIEWFN[state.view]||vHome)(); renderMenu(); renderDD(); drawQR(); }
$('#app').addEventListener('click',e=>{
  const row=e.target.closest('tr[data-resp]'); if(row&&!e.target.closest('[data-go]')){state.resp=+row.dataset.resp;render();return;}
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.create){state.create=t.dataset.create;state.wiz=1;render();}
  else if(t.dataset.ft){state.fileType=t.dataset.ft;render();}
  else if(t.id==='readfile'){t.textContent='Đang đọc file…';t.disabled=true;setTimeout(()=>{state.wiz=2;state.fixed=false;render();},700);}
  else if(t.id==='back1'){state.wiz=1;render();}
  else if(t.id==='save'){state.survey=1;state.q='q3';state.etab='q';go('edit');toast('Đã lưu bản nháp với 10 câu hỏi');}
  else if(t.dataset.q){state.q=t.dataset.q;render();const c=$('#qc'+state.q);if(c)c.scrollIntoView({block:'start',behavior:'smooth'});}
  else if(t.dataset.tp){state.tp=state.tp===t.dataset.tp?0:t.dataset.tp;render();}
  else if(t.dataset.settype){const [id,ty]=t.dataset.settype.split('|');QS.find(x=>x.id===id).t=ty;state.q=id;state.tp=0;render();}
  else if(t.dataset.add){const k=t.dataset.add, id='n'+(++uid);
    const it=k==='q'?{id,q:'Câu hỏi mới',t:'Trả lời ngắn',req:false}:k==='sec'?{id,sec:'Phần mới'}:{id,b:k,text:'',cap:'',url:''};
    let i=t.dataset.end?QS.length-1:QS.findIndex(x=>x.id===state.q); if(i<0) i=QS.length-1;
    QS.splice(i+1,0,it); state.q=id; render(); const c=$('#qc'+id); if(c) c.scrollIntoView({block:'center',behavior:'smooth'}); toast('Đã thêm '+(k==='q'?'câu hỏi':k==='sec'?'phần mới':k.toLowerCase()));}
  else if(t.dataset.mv){const [id,dir]=t.dataset.mv.split('|'); const i=QS.findIndex(x=>x.id===id), j=i+ +dir; if(j>=0&&j<QS.length){[QS[i],QS[j]]=[QS[j],QS[i]]; state.q=id; render(); const c=$('#qc'+id); if(c) c.scrollIntoView({block:'nearest'});}}
  else if(t.dataset.dup){const i=QS.findIndex(x=>x.id===t.dataset.dup); const c=JSON.parse(JSON.stringify(QS[i])); c.id='n'+(++uid); QS.splice(i+1,0,c); state.q=c.id; render(); toast('Đã nhân bản');}
  else if(t.dataset.del){const i=QS.findIndex(x=>x.id===t.dataset.del); const [g]=QS.splice(i,1); state.q=(QS[i]||QS[i-1]||{}).id; render(); toast('Đã xóa'+(g.q!=null?' câu hỏi':g.sec!=null?' phần':'')+' (mockup, chưa có hoàn tác)');}
  else if(t.dataset.pvs){state.pvs=t.dataset.pvs;render();}
  else if(t.dataset.rt){state.rtab=t.dataset.rt;render();}
  else if(t.dataset.pv){state.pv=!state.pv;render();}
  else if(t.dataset.range){state.range=t.dataset.range;render();}
  else if(t.dataset.dev){state.dev=t.dataset.dev;render();}
  else if(t.dataset.mode){state.mode=t.dataset.mode;render();}
  else if(t.dataset.toast) toast(t.dataset.toast);
  else if(t.id==='cp'){const val=$('#lnk').value; Promise.resolve().then(()=>navigator.clipboard.writeText(val)).then(()=>toast('Đã sao chép link'),()=>{$('#lnk').select();toast('Đã chọn link, bấm Ctrl+C để sao chép')});}
});
document.addEventListener('click',e=>{if(state.tp&&!e.target.closest('.tpick')){state.tp=0;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.tp){state.tp=0;render();}});
$('#app').addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='pick'){state.survey=+el.value;render();}
  else if(el.dataset.more&&el.selectedIndex>0){toast('Mockup: '+el.value);el.selectedIndex=0;}

});
/* chọn mục đang soạn khi bấm vào thẻ (không vẽ lại để không mất con trỏ) */
$('#app').addEventListener('focusin',e=>{const c=e.target.closest('[data-card]'); if(!c||c.dataset.card===state.q) return; state.q=c.dataset.card;
  document.querySelectorAll('[data-card].focus').forEach(x=>x.classList.remove('focus')); c.classList.add('focus');
  document.querySelectorAll('.qi.on').forEach(x=>x.classList.remove('on')); const o=document.querySelector('.qi[data-q="'+state.q+'"]'); if(o) o.classList.add('on');});
/* kéo thả đổi thứ tự (cả mục lục bên trái và thẻ bên phải) */
let dragId=null;
const clearDrop=()=>document.querySelectorAll('.dropat').forEach(x=>x.classList.remove('dropat'));
$('#app').addEventListener('dragstart',e=>{const d=e.target.closest&&e.target.closest('[data-drag]'); if(!d) return; dragId=d.dataset.drag; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
$('#app').addEventListener('dragover',e=>{if(!dragId) return; const o=e.target.closest('[data-dropid]'); if(!o) return; e.preventDefault(); if(!o.classList.contains('dropat')){clearDrop(); o.classList.add('dropat');}});
$('#app').addEventListener('drop',e=>{const o=e.target.closest('[data-dropid]'); if(!dragId||!o) return; e.preventDefault(); const tid=o.dataset.dropid; clearDrop();
  if(tid!==dragId){const from=QS.findIndex(x=>x.id===dragId), down=from<QS.findIndex(x=>x.id===tid); const [it]=QS.splice(from,1); const to=QS.findIndex(x=>x.id===tid); QS.splice(down?to+1:to,0,it); state.q=dragId; render(); toast('Đã đổi thứ tự, số câu tự đánh lại');}
  dragId=null;});
$('#app').addEventListener('dragend',()=>{dragId=null; clearDrop();});
const h0=location.hash.slice(1); if(TITLE[h0]) state.view=h0;
render();
